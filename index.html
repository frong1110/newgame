<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>newgame - prototype</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #ccc;
    }
    #wrap { text-align: center; }
    canvas {
      background: #1e2a38;
      image-rendering: pixelated;
      border: 2px solid #333;
      max-width: 100vw;
    }
    p { margin: 8px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <p>← → 이동 · Space 점프 (공중에서 한 번 더 = 2단 점프) · X 공격 (꾹 누르면 연속) · Shift 대시 · K 스킬 트리 · R 처음부터</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
