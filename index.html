<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>newgame - prototype</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #ccc;
    }
    #wrap { text-align: center; }
    canvas {
      background: #1e2a38;
      image-rendering: pixelated;
      border: 2px solid #333;
      max-width: 100vw;
    }
    p { margin: 8px 0 0; font-size: 14px; }

    /* ---------- 모바일 (터치 버튼) ---------- */
    body.touch {
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body.touch #wrap p { display: none; }
    body.touch canvas {
      display: block;
      border: none;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      max-height: 100vh;
    }
    #touch-controls { position: fixed; inset: 0; pointer-events: none; }
    #touch-controls button, #touch-controls .dpad {
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
    }
    .dpad {
      position: absolute;
      left: calc(env(safe-area-inset-left) + 3vw);
      bottom: 6vh;
      width: min(34vh, 180px);
      height: min(34vh, 180px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
    }
    .dpad .knob {
      position: absolute;
      left: 32%;
      top: 32%;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }
    .actions {
      position: absolute;
      right: calc(env(safe-area-inset-right) + 3vw);
      bottom: 6vh;
      width: min(40vh, 210px);
      height: min(40vh, 210px);
    }
    .btn {
      position: absolute;
      width: 38%;
      height: 38%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: min(2.6vh, 14px);
      font-weight: bold;
    }
    .btn.on { background: rgba(255, 204, 77, 0.55); }
    .btn.jump { left: 31%; bottom: 0; }
    .btn.attack { left: 0; top: 31%; background: rgba(255, 120, 90, 0.25); }
    .btn.dash { right: 0; top: 31%; background: rgba(120, 214, 255, 0.25); }
    .btn.special { left: 31%; top: 0; }
    .topbar {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 1.5vh);
      right: calc(env(safe-area-inset-right) + 2vw);
      display: flex;
      gap: 8px;
    }
    .small {
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 13px;
    }
    .small.on { background: rgba(255, 204, 77, 0.55); }
    .panel-only { display: none; }
    body.panel-open .panel-only { display: inline-block; }
    body.panel-open .dpad, body.panel-open .actions { display: none; }
    .rotate {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-size: 20px;
      pointer-events: auto;
    }
    @media (orientation: portrait) {
      body.touch .rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <p>← → 이동 · Space 점프 (공중에서 한 번 더 = 2단 점프) · X 사슬 휘두르기 (꾹 누르면 연속) · C 당기기 · Shift 대시 · K 스킬 트리(클릭해서 적용) · R 처음부터</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
